logLevel: info
logDestinations: [stdout]
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 256
udpMaxPayloadSize: 1452

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path: astra
      - action: read
        path: arm
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api

api: true
apiAddress: 127.0.0.1:9997

rtsp: false
rtmp: false
hls: false
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: true

srt: false
moq: false

paths:
  astra:
    source: udp+rtp://127.0.0.1:5710
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=EMMA Astra Annotated
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5710 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=recvonly
  arm:
    source: udp+rtp://127.0.0.1:5711
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=EMMA Arm Camera Annotated
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5711 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=recvonly
